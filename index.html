<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background-image:url(photography.png);
		background-size:cover;
		background-position:center;
		background-repeat:no-repeat;
    }

   .login-box{
    width:350px;
    padding:40px;
    background: linear-gradient(to right, #2193b0, #6dd5ed);
    border-radius:20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    text-align:center;
    color:white;
}

    .login-box h2{
    margin-bottom:25px;
    color:#003366;  
}

    .input-box{
        margin-bottom:15px;
        text-align:left;
    }

    .input-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    border:none;
    outline:none;
}

.login-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#00c6ff;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#0099cc;
}
    .footer-text{
        margin-top:15px;
        font-size:13px;
        color:#003366;
    }
</style>

</head>
<body>

<div class="login-box">
    <h2>Login</h2>
	<div class="input-box">
    <input type="text" id="username" placeholder="Username">
</div>

<div class="input-box">
    <input type="password" id="password" placeholder="Password">
</div>

<button class="login-btn" onclick="login()">Login</button>

  
   

    <div class="footer-text">
        For photographers & creators 🌿
    </div>
</div>
<script>
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "admin" && pass === "1234") {
        localStorage.setItem("loggedIn", "true");
        window.location.href = "home.html"; // redirect to main page
    } else {
        alert("Invalid login");
    }
}
</script>
</body>
</html>
